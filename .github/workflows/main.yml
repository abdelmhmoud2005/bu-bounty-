name: Full Security Assessment

on:
  workflow_dispatch: # يمكنك تشغيله يدوياً، أو تغييره إلى push أو schedule حسب حاجتك

jobs:
  security-assessment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git curl unzip wget npm

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify Go version
        run: go version

      - name: Install ProjectDiscovery tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest

      # ==========================================
      # ⬇️ تطبيق الحل الثالث: تجاهل الفشل وإكمال باقي الخطوات ⬇️
      # ==========================================
      - name: Install additional recon tools
        continue-on-error: true  # 👈 هذا السطر هو الحل النهائي لتجاوز الفشل
        run: |
          go install github.com/Th1Hu/jsubfinder/cmd/jsubfinder@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/qsreplace@latest

      # ==========================================
      # ⬆️ باقي الخطوات ستعمل بشكل طبيعي حتى لو فشلت الخطوة السابقة ⬆️
      # ==========================================

      - name: Install Gf patterns
        run: |
          go install github.com/tomnomnom/gf@latest
          mkdir -p ~/.gf
          git clone https://github.com/1ndianl33t/Gf-Patterns ~/.gf

      - name: Install Python tools
        run: |
          python3 -m pip install --upgrade pip
          pip install arjun dirsearch

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Retire.js
        run: |
          npm install -g retire

      - name: Install SQLMap
        run: |
          sudo apt-get install -y sqlmap

      - name: Install XSStrike
        run: |
          git clone https://github.com/s0md3v/XSStrike.git
          cd XSStrike
          pip install -r requirements.txt

      - name: Prepare wordlists
        run: |
          mkdir -p wordlists
          wget https://github.com/danielmiessler/SecLists/archive/master.zip -O seclists.zip
          unzip -q seclists.zip -d wordlists
          # يمكنك إضافة أوامر تحضير قوائم الكلمات الخاصة بك هنا

      - name: Prepare workspace
        run: |
          mkdir -p recon_results
          echo "Workspace prepared successfully."