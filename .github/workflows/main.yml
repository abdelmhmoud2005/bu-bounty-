name: Full Security Assessment

on:
  workflow_dispatch:
    inputs:
      active_scan:
        description: "Enable active security testing"
        required: true
        default: false
        type: boolean
      enable_sqlmap:
        description: "Enable SQLMap"
        required: true
        default: false
        type: boolean
      enable_dalfox:
        description: "Enable Dalfox XSS scanning"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

env:
  # ============================================================
  # CHANGE THIS — النطاق المستهدف
  # ============================================================
  TARGET: "platacard.mx"

  ACTIVE_SCAN: "false"
  ENABLE_SQLMAP: "false"
  ENABLE_DALFOX: "false"
  RATE_LIMIT: "10"
  NUCLEI_RATE_LIMIT: "25"

jobs:
  security-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      # ============================================================
      # 1. تثبيت الاعتماديات الأساسية (تم إزالة docker.io)
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget jq unzip \
            python3 python3-pip python3-venv \
            golang nodejs npm nmap \
            libpcap-dev

      # ============================================================
      # 2. تثبيت أدوات ProjectDiscovery
      # ============================================================
      - name: Install ProjectDiscovery tools
        run: |
          export PATH="$HOME/go/bin:$PATH"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/alterx/cmd/alterx@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 3. تثبيت أدوات Recon إضافية
      # ============================================================
      - name: Install additional recon tools
        run: |
          export PATH="$HOME/go/bin:$PATH"
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install github.com/gitleaks/gitleaks/v8@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 4. تثبيت أدوات Python
      # ============================================================
      - name: Install Python tools
        run: |
          python3 -m pip install --break-system-packages uro jsbeautifier

          git clone --depth 1 https://github.com/GerbenJavado/LinkFinder.git /tmp/linkfinder
          cd /tmp/linkfinder && python3 -m pip install --break-system-packages -r requirements.txt

          git clone --depth 1 https://github.com/m4ll0k/SecretFinder.git /tmp/secretfinder
          cd /tmp/secretfinder && python3 -m pip install --break-system-packages -r requirements.txt

      # ============================================================
      # 5. TruffleHog
      # ============================================================
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      # ============================================================
      # 6. Retire.js
      # ============================================================
      - name: Install Retire.js
        run: npm install -g retire

      # ============================================================
      # 7. SQLMap
      # ============================================================
      - name: Install SQLMap
        run: |
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /opt/sqlmap
          echo "SQLMAP_PATH=/opt/sqlmap/sqlmap.py" >> "$GITHUB_ENV"

      # ============================================================
      # 8. XSStrike
      # ============================================================
      - name: Install XSStrike
        run: |
          git clone --depth 1 https://github.com/s0md3v/XSStrike.git /opt/xsstrike
          cd /opt/xsstrike && python3 -m pip install --break-system-packages -r requirements.txt

      # ============================================================
      # 9. تحضير مساحة العمل
      # ============================================================
      - name: Prepare workspace
        run: |
          mkdir -p results/{subdomains,dns,http,ports,urls,js,js/files,params,secrets,nuclei,zap,sqlmap,xss,retire,linkfinder,secretfinder,trufflehog}

      # ============================================================
      # 10. التحقق من الهدف
      # ============================================================
      - name: Verify target
        run: |
          echo "Target: $TARGET"
          if [[ "$TARGET" == *"/"* ]] || [[ "$TARGET" == *"://"* ]]; then
            echo "ERROR: TARGET must be a hostname only."
            exit 1
          fi
          echo "$TARGET" > results/target.txt

      # ============================================================
      # 11. تعداد النطاقات الفرعية
      # ============================================================
      - name: Subdomain enumeration
        run: |
          subfinder -d "$TARGET" -silent -all -o results/subdomains/subfinder.txt || true
          cat results/subdomains/subfinder.txt 2>/dev/null | sort -u > results/subdomains/all.txt || true
          echo "Total: $(wc -l < results/subdomains/all.txt)"

      # ============================================================
      # 12. DNS
      # ============================================================
      - name: DNS resolution
        run: |
          if [ -s results/subdomains/all.txt ]; then
            dnsx -l results/subdomains/all.txt -silent -a -aaaa -cname -resp \
              -o results/dns/dnsx.txt || true
          fi

      # ============================================================
      # 13. HTTP Probing
      # ============================================================
      - name: HTTP probing
        run: |
          httpx -l results/subdomains/all.txt \
            -silent -follow-redirects \
            -status-code -title -tech-detect -web-server \
            -content-length -location \
            -o results/http/httpx.txt || true
          if [ -s results/http/httpx.txt ]; then
            awk '{print $1}' results/http/httpx.txt | sort -u > results/http/live.txt
          fi

      # ============================================================
      # 14. فحص المنافذ
      # ============================================================
      - name: Port scanning
        run: |
          if [ -s results/subdomains/all.txt ]; then
            naabu -list results/subdomains/all.txt -top-ports 100 \
              -rate "$RATE_LIMIT" -silent -o results/ports/naabu.txt || true
          fi

      # ============================================================
      # 15. جمع URLs
      # ============================================================
      - name: Historical URLs
        run: |
          if [ -s results/subdomains/all.txt ]; then
            cat results/subdomains/all.txt | gau --threads 5 > results/urls/gau.txt || true
            cat results/subdomains/all.txt | waybackurls > results/urls/wayback.txt || true
          fi

      # ============================================================
      # 16. Katana
      # ============================================================
      - name: Crawling
        run: |
          if [ -s results/http/live.txt ]; then
            katana -list results/http/live.txt -silent -d 3 -jc -kf all \
              -o results/urls/katana.txt || true
          fi

      # ============================================================
      # 17. دمج URLs
      # ============================================================
      - name: Merge URLs
        run: |
          touch results/urls/gau.txt results/urls/wayback.txt results/urls/katana.txt
          cat results/urls/gau.txt results/urls/wayback.txt results/urls/katana.txt \
            | sort -u > results/urls/all-raw.txt
          cat results/urls/all-raw.txt | uro > results/urls/all.txt \
            || cp results/urls/all-raw.txt results/urls/all.txt

      # ============================================================
      # 18. استخراج Parameters
      # ============================================================
      - name: Extract parameters
        run: |
          grep '?' results/urls/all.txt | sort -u > results/params/parameterized.txt || true

      # ============================================================
      # 19. استخراج JS
      # ============================================================
      - name: Extract JS URLs
        run: |
          grep -Ei '\.js([?#].*)?$' results/urls/all.txt | sort -u > results/js/javascript.txt || true

      - name: Download JS
        run: |
          if [ -s results/js/javascript.txt ]; then
            while read -r url; do
              hash=$(printf '%s' "$url" | sha256sum | cut -d' ' -f1)
              curl -Lks --max-time 20 --retry 1 "$url" \
                -o "results/js/files/$hash.js" || true
            done < results/js/javascript.txt
          fi

      # ============================================================
      # 20. LinkFinder
      # ============================================================
      - name: LinkFinder
        run: |
          if [ -d results/js/files ] && [ "$(ls -A results/js/files 2>/dev/null)" ]; then
            for f in results/js/files/*.js; do
              [ -s "$f" ] || continue
              python3 /tmp/linkfinder/linkfinder.py -i "$f" -o cli \
                2>/dev/null >> results/linkfinder/endpoints.txt || true
            done
            sort -u results/linkfinder/endpoints.txt -o results/linkfinder/endpoints.txt 2>/dev/null || true
          fi

      # ============================================================
      # 21. SecretFinder
      # ============================================================
      - name: SecretFinder
        run: |
          if [ -d results/js/files ] && [ "$(ls -A results/js/files 2>/dev/null)" ]; then
            for f in results/js/files/*.js; do
              [ -s "$f" ] || continue
              python3 /tmp/secretfinder/SecretFinder.py -i "$f" -o cli \
                2>/dev/null >> results/secretfinder/secrets.txt || true
            done
            sort -u results/secretfinder/secrets.txt -o results/secretfinder/secrets.txt 2>/dev/null || true
          fi

      # ============================================================
      # 22. Grep + TruffleHog
      # ============================================================
      - name: Grep secrets
        run: |
          grep -RniE \
            'api[_-]?key|apikey|secret|token|authorization|bearer|password|private[_-]?key|aws_access|firebase|graphql' \
            results/js/files > results/secrets/js-interesting.txt 2>/dev/null || true

      - name: TruffleHog
        run: |
          if [ -d results/js/files ] && [ "$(ls -A results/js/files 2>/dev/null)" ]; then
            trufflehog filesystem results/js/files --json \
              > results/trufflehog/findings.json 2>/dev/null || true
          fi

      # ============================================================
      # 23. Retire.js
      # ============================================================
      - name: Retire.js
        run: |
          if [ -d results/js/files ] && [ "$(ls -A results/js/files 2>/dev/null)" ]; then
            retire --path results/js/files --outputformat json \
              --outputpath results/retire/retire.json --exitwith 0 || true
          fi

      # ============================================================
      # 24. Nuclei
      # ============================================================
      - name: Nuclei templates
        run: nuclei -update-templates -silent || true

      - name: Nuclei scan
        run: |
          if [ -s results/http/live.txt ]; then
            nuclei -l results/http/live.txt \
              -severity info,low,medium,high,critical \
              -exclude-tags dos,fuzz \
              -rate-limit "$NUCLEI_RATE_LIMIT" \
              -bulk-size 10 -c 5 \
              -o results/nuclei/nuclei.txt || true
          fi

      # ============================================================
      # 25. SQLMap
      # ============================================================
      - name: SQLMap
        if: ${{ github.event.inputs.enable_sqlmap == 'true' }}
        run: |
          if [ -s results/params/parameterized.txt ]; then
            head -10 results/params/parameterized.txt > /tmp/sqlmap_targets.txt
            while read -r url; do
              python3 "$SQLMAP_PATH" -u "$url" \
                --batch --level=1 --risk=1 \
                --output-dir=results/sqlmap \
                --timeout=10 --retries=1 \
                --threads=2 --random-agent \
                --flush-session 2>/dev/null || true
            done < /tmp/sqlmap_targets.txt
          fi

      # ============================================================
      # 26. Dalfox XSS
      # ============================================================
      - name: Dalfox
        if: ${{ github.event.inputs.enable_dalfox == 'true' }}
        run: |
          if [ -s results/params/parameterized.txt ]; then
            head -20 results/params/parameterized.txt > /tmp/xss_targets.txt
            dalfox file /tmp/xss_targets.txt \
              --silence --no-color \
              --output results/xss/dalfox.txt \
              --rate-limit "$RATE_LIMIT" \
              --timeout 10 --worker 2 2>/dev/null || true
          fi

      # ============================================================
      # 27. ZAP Baseline
      # ============================================================
      - name: ZAP baseline
        run: |
          docker run --rm \
            -v "$PWD/results/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "https://$TARGET" \
            -r zap-baseline.html \
            -J zap-baseline.json \
            -w zap-baseline.md \
            -m 10 || true

      # ============================================================
      # 28. ZAP Active (اختياري)
      # ============================================================
      - name: ZAP active scan
        if: ${{ github.event.inputs.active_scan == 'true' }}
        run: |
          docker run --rm \
            -v "$PWD/results/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t "https://$TARGET" \
            -r zap-full.html \
            -J zap-full.json \
            -w zap-full.md \
            -m 30 || true

      # ============================================================
      # 29. Summary
      # ============================================================
      - name: Create summary
        run: |
          {
            echo "# Security Assessment Report"
            echo ""
            echo "**Target:** \`$TARGET\`"
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## Counts"
            echo ""
            echo "| Category | Count |"
            echo "|---|---:|"
            printf "| Subdomains | %s |\n" "$(wc -l < results/subdomains/all.txt 2>/dev/null || echo 0)"
            printf "| Live hosts | %s |\n" "$(wc -l < results/http/live.txt 2>/dev/null || echo 0)"
            printf "| URLs | %s |\n" "$(wc -l < results/urls/all.txt 2>/dev/null || echo 0)"
            printf "| JS files | %s |\n" "$(wc -l < results/js/javascript.txt 2>/dev/null || echo 0)"
            printf "| Nuclei findings | %s |\n" "$(wc -l < results/nuclei/nuclei.txt 2>/dev/null || echo 0)"
            printf "| JS Secrets | %s |\n" "$(wc -l < results/secretfinder/secrets.txt 2>/dev/null || echo 0)"
            echo ""
            echo "## Important"
            echo "Automated findings require manual validation."
          } > results/SUMMARY.md

      # ============================================================
      # 30. Upload
      # ============================================================
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: full-security-assessment
          path: results/
          retention-days: 14