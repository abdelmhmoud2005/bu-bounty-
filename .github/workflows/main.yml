name: Full Security Assessment (Parallel)

on:
  workflow_dispatch:
    inputs:
      active_scan:
        description: "Enable active security testing"
        required: true
        default: false
        type: boolean
      enable_sqlmap:
        description: "Enable SQLMap"
        required: true
        default: false
        type: boolean
      enable_dalfox:
        description: "Enable Dalfox XSS scanning"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

env:
  TARGET: "https://www.nn-group.com/"
  ACTIVE_SCAN: "false"
  ENABLE_SQLMAP: "true"
  ENABLE_DALFOX: "false"
  RATE_LIMIT: "10"
  NUCLEI_RATE_LIMIT: "25"

jobs:

  # ============================================================
  # المرحلة 1: تعداد النطاقات الفرعية (يعمل بالتوازي)
  # ============================================================
  subdomain-enumeration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25', check-latest: true }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y dnsutils python3-pip
          pip install --break-system-packages dnsgen
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/alterx/cmd/alterx@latest
          go install github.com/tomnomnom/assetfinder@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Subdomain Enumeration
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p results/subdomains
          subfinder -d "$TARGET" -silent -all -o results/subdomains/subfinder.txt || true
          assetfinder --subs-only "$TARGET" > results/subdomains/assetfinder.txt || true
          cat results/subdomains/*.txt 2>/dev/null | sort -u > results/subdomains/all-raw.txt
          cat results/subdomains/all-raw.txt | dnsgen - > results/subdomains/dnsgen.txt || true
          cat results/subdomains/all-raw.txt | alterx -silent > results/subdomains/alterx.txt || true
          cat results/subdomains/dnsgen.txt results/subdomains/alterx.txt | sort -u >> results/subdomains/all-raw.txt
          dnsx -l results/subdomains/all-raw.txt -silent -a -resp 2>/dev/null | awk '{print $1}' | sort -u > results/subdomains/all.txt || true
          echo "Resolved: $(wc -l < results/subdomains/all.txt)"
      - name: Upload Subdomains
        uses: actions/upload-artifact@v4
        with:
          name: subdomains
          path: results/subdomains/

  # ============================================================
  # المرحلة 1: فحص المنافذ (يعمل بالتوازي مع تعداد النطاقات)
  # ============================================================
  port-scanning:
    needs: subdomain-enumeration
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download Subdomains
        uses: actions/download-artifact@v4
        with: { name: subdomains, path: results/subdomains/ }
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y nmap
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Port Scan
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p results/ports
          if [ -s results/subdomains/all.txt ]; then
            naabu -list results/subdomains/all.txt -top-ports 100 -rate "$RATE_LIMIT" -silent -o results/ports/naabu.txt || true
            if [ -s results/ports/naabu.txt ]; then
              awk -F: '{print $1}' results/ports/naabu.txt | sort -u > results/ports/ips.txt
              nmap -sV --top-ports 30 -iL results/ports/ips.txt -oN results/ports/nmap.txt --min-rate 100 2>/dev/null || true
            fi
          fi
      - name: Upload Ports
        uses: actions/upload-artifact@v4
        with: { name: ports, path: results/ports/ }

  # ============================================================
  # المرحلة 2: جمع الروابط والزحف (يعمل بالتوازي مع Nuclei)
  # ============================================================
  url-crawling:
    needs: subdomain-enumeration
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Download Subdomains
        uses: actions/download-artifact@v4
        with: { name: subdomains, path: results/subdomains/ }
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Install tools
        run: |
          pip install --break-system-packages uro
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/jaeles-project/gospider@latest
          go install github.com/hakluke/hakrawler@latest
          go install github.com/tomnomnom/unfurl@latest
          go install github.com/tomnomnom/qsreplace@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run URL Crawling
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p results/{http,urls,gospider,params,gf}
          httpx -l results/subdomains/all.txt -silent -follow-redirects -status-code -title -tech-detect -o results/http/httpx.txt || true
          awk '{print $1}' results/http/httpx.txt | sort -u > results/http/live.txt
          cat results/subdomains/all.txt | gau --threads 5 > results/urls/gau.txt || true
          cat results/subdomains/all.txt | waybackurls > results/urls/wayback.txt || true
          katana -list results/http/live.txt -silent -d 3 -jc -kf all -aff -o results/urls/katana.txt || true
          gospider -S results/http/live.txt -c 10 -d 3 -t 20 --sitemap --robots --other-source --include-subs -o results/gospider/ 2>/dev/null || true
          find results/gospider -name '*.txt' -exec cat {} \; 2>/dev/null | grep -oE 'https?://[^ ]+' | sort -u > results/urls/gospider.txt || true
          cat results/urls/gau.txt results/urls/wayback.txt results/urls/katana.txt results/urls/gospider.txt 2>/dev/null | sort -u > results/urls/all-raw.txt
          cat results/urls/all-raw.txt | uro > results/urls/all.txt || cp results/urls/all-raw.txt results/urls/all.txt
          grep '?' results/urls/all.txt | sort -u > results/params/parameterized.txt || true
          cat results/params/parameterized.txt | unfurl -u keys 2>/dev/null | tr ',' '\n' | sort -u > results/params/unique-keys.txt || true
      - name: Upload URLs & Params
        uses: actions/upload-artifact@v4
        with: { name: urls, path: results/urls/ }
      - name: Upload Params
        uses: actions/upload-artifact@v4
        with: { name: params, path: results/params/ }
      - name: Upload Live Hosts
        uses: actions/upload-artifact@v4
        with: { name: live-hosts, path: results/http/live.txt }

  # ============================================================
  # المرحلة 2: فحص Nuclei (يعمل بالتوازي مع جمع الروابط)
  # ============================================================
  nuclei-scan:
    needs: subdomain-enumeration
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download Subdomains
        uses: actions/download-artifact@v4
        with: { name: subdomains, path: results/subdomains/ }
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Install tools
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Nuclei
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p results/{http,nuclei}
          httpx -l results/subdomains/all.txt -silent -follow-redirects -o results/http/httpx.txt || true
          awk '{print $1}' results/http/httpx.txt | sort -u > results/http/live.txt
          if [ -s results/http/live.txt ]; then
            nuclei -l results/http/live.txt -severity info,low,medium,high,critical -exclude-tags dos,fuzz -rate-limit "$NUCLEI_RATE_LIMIT" -bulk-size 10 -c 5 -o results/nuclei/nuclei.txt || true
          fi
      - name: Upload Nuclei Results
        uses: actions/upload-artifact@v4
        with: { name: nuclei-results, path: results/nuclei/ }

  # ============================================================
  # المرحلة 3: فحص الأسرار و JS (يعمل بالتوازي مع XSS/SQLMap)
  # ============================================================
  secrets-scan:
    needs: url-crawling
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Download URLs
        uses: actions/download-artifact@v4
        with: { name: urls, path: results/urls/ }
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Install tools
        run: |
          npm install -g retire
          pip install --break-system-packages jsbeautifier
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          go install github.com/lc/subjs@latest
          go install github.com/003random/getJS@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/anew@latest
          # استخدام المسار الصحيح لـ jsubfinder
          go install github.com/ThreatUnkown/jsubfinder@latest
          git clone --depth 1 https://github.com/GerbenJavado/LinkFinder.git /tmp/linkfinder
          cd /tmp/linkfinder && pip install --break-system-packages -r requirements.txt
          git clone --depth 1 https://github.com/m4ll0k/SecretFinder.git /tmp/secretfinder
          cd /tmp/secretfinder && pip install --break-system-packages -r requirements.txt
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Secrets Scan
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p results/{js,js/files,secrets,retire,trufflehog,linkfinder,secretfinder,jsubfinder}
          grep -Ei '\.js([?#].*)?$' results/urls/all.txt | sort -u > results/js/javascript.txt || true
          if [ -s results/js/javascript.txt ]; then
            while read -r url; do
              hash=$(printf '%s' "$url" | sha256sum | cut -d' ' -f1)
              curl -Lks --max-time 20 -A "Mozilla/5.0" "$url" -o "results/js/files/$hash.js" || true
            done < results/js/javascript.txt
          fi
          # LinkFinder
          for f in results/js/files/*.js; do
            [ -s "$f" ] || continue
            python3 /tmp/linkfinder/linkfinder.py -i "$f" -o cli 2>/dev/null >> results/linkfinder/endpoints.txt || true
          done
          # SecretFinder
          for f in results/js/files/*.js; do
            [ -s "$f" ] || continue
            python3 /tmp/secretfinder/SecretFinder.py -i "$f" -o cli 2>/dev/null >> results/secretfinder/secrets.txt || true
          done
          # JSubFinder
          jsubfinder scan results/js/files -s -o results/jsubfinder/subs.txt 2>/dev/null || true
          # Grep Secrets
          grep -RniE 'api[_-]?key|secret|password|token|bearer|aws_access' results/js/files > results/secrets/js-interesting.txt 2>/dev/null || true
          # TruffleHog
          trufflehog filesystem results/js/files --json > results/trufflehog/findings.json 2>/dev/null || true
          # Retire.js
          retire --path results/js/files --outputformat json --outputpath results/retire/retire.json --exitwith 0 || true
      - name: Upload Secrets Results
        uses: actions/upload-artifact@v4
        with: { name: secrets-results, path: results/ }

  # ============================================================
  # المرحلة 3: فحص XSS و SQLMap (يعمل بالتوازي مع فحص الأسرار)
  # ============================================================
  xss-sqlmap-scan:
    needs: url-crawling
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Download Params & URLs
        uses: actions/download-artifact@v4
        with: { name: params, path: results/params/ }
      - uses: actions/download-artifact@v4
        with: { name: urls, path: results/urls/ }
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Install tools
        run: |
          sudo apt-get install -y python3-pip
          pip install --break-system-packages arjun
          go install github.com/hahwul/dalfox/v2@latest
          go install github.com/Emoe/kxss@latest
          go install github.com/ffuf/ffuf/v2@latest
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /opt/sqlmap
          git clone --depth 1 https://github.com/s0md3v/XSStrike.git /opt/xsstrike
          cd /opt/xsstrike && pip install --break-system-packages -r requirements.txt
          git clone --depth 1 https://github.com/s0md3v/Corsy.git /opt/corsy
          cd /opt/corsy && pip install --break-system-packages -r requirements.txt
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "SQLMAP_PATH=/opt/sqlmap/sqlmap.py" >> $GITHUB_ENV
      - name: Run XSS & SQLMap
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p results/{xss,sqlmap,arjun,kxss,corsy}
          # Kxss
          if [ -s results/params/parameterized.txt ]; then
            head -100 results/params/parameterized.txt | qsreplace 'AaAaAa' | kxss > results/kxss/reflected.txt || true
          fi
          # Dalfox
          if [ -s results/params/parameterized.txt ]; then
            head -30 results/params/parameterized.txt | dalfox pipe --silence --no-color --rate-limit "$RATE_LIMIT" --timeout 10 --worker 3 --output results/xss/dalfox.txt || true
          fi
          # SQLMap (مشروط)
          if [ "${{ github.event.inputs.enable_sqlmap }}" = "true" ] && [ -s results/params/parameterized.txt ]; then
            head -10 results/params/parameterized.txt > /tmp/sqlmap_targets.txt
            while read -r url; do
              timeout 60 python3 $SQLMAP_PATH -u "$url" --batch --level=1 --risk=1 --output-dir=results/sqlmap --timeout=10 --retries=1 --threads=2 --random-agent --flush-session 2>/dev/null || true
            done < /tmp/sqlmap_targets.txt
          fi
          # Corsy
          if [ -s results/urls/all.txt ]; then
            head -20 results/urls/all.txt > /tmp/corsy_targets.txt
            python3 /opt/corsy/corsy.py -i /tmp/corsy_targets.txt -t 10 -o results/corsy/report.txt 2>/dev/null || true
          fi
      - name: Upload XSS Results
        uses: actions/upload-artifact@v4
        with: { name: xss-results, path: results/xss/ }
      - name: Upload SQLMap Results
        uses: actions/upload-artifact@v4
        with: { name: sqlmap-results, path: results/sqlmap/ }
      - name: Upload Other Results
        uses: actions/upload-artifact@v4
        with: { name: other-results, path: results/ }

  # ============================================================
  # المرحلة 4: ZAP + التقرير النهائي (يعمل بعد اكتمال كل المهام)
  # ============================================================
  zap-and-summary:
    needs: [port-scanning, nuclei-scan, secrets-scan, xss-sqlmap-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with: { path: results/ }
      - name: Run ZAP Baseline
        run: |
          mkdir -p results/zap
          docker run --rm -v "$PWD/results/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "https://$TARGET" -r zap-baseline.html -J zap-baseline.json -w zap-baseline.md -m 10 || true
      - name: Run ZAP Active (Conditional)
        if: ${{ github.event.inputs.active_scan == 'true' }}
        run: |
          docker run --rm -v "$PWD/results/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "https://$TARGET" -r zap-full.html -J zap-full.json -w zap-full.md -m 30 || true
      - name: Create Summary
        run: |
          {
            echo "# 🛡️ Security Assessment Report"
            echo "**Target:** \`$TARGET\`"
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "## 📊 Counts"
            printf "| Subdomains (resolved) | %s |\n" "$(wc -l < results/subdomains/all.txt 2>/dev/null || echo 0)"
            printf "| Live hosts | %s |\n" "$(wc -l < results/http/live.txt 2>/dev/null || echo 0)"
            printf "| Open ports | %s |\n" "$(wc -l < results/ports/naabu.txt 2>/dev/null || echo 0)"
            printf "| URLs | %s |\n" "$(wc -l < results/urls/all.txt 2>/dev/null || echo 0)"
            printf "| JS files | %s |\n" "$(wc -l < results/js/javascript.txt 2>/dev/null || echo 0)"
            printf "| Nuclei findings | %s |\n" "$(wc -l < results/nuclei/nuclei.txt 2>/dev/null || echo 0)"
            printf "| XSS findings | %s |\n" "$(wc -l < results/xss/dalfox.txt 2>/dev/null || echo 0)"
            printf "| TruffleHog findings | %s |\n" "$(wc -l < results/trufflehog/findings.json 2>/dev/null || echo 0)"
          } > results/SUMMARY.md
      - name: Upload Final Results
        uses: actions/upload-artifact@v4
        with:
          name: full-security-assessment
          path: results/
          retention-days: 14